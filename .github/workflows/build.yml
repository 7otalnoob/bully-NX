name: build-switch

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with devkitA64
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            --workdir /project \
            devkitpro/devkita64 \
            sh -lc 'make clean && make -j$(nproc)'

      - name: Collect output
        run: |
          mkdir -p out
          find . -maxdepth 1 \( -name "*.nro" -o -name "*.elf" -o -name "*.nacp" \) -exec cp {} out/ \;
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bully-nx-build
          path: out/*

      - name: Publish as release (públicamente descargable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-build --yes || true
          git tag -f latest-build
          git push -f origin latest-build
          gh release create latest-build out/* --title "Latest automated build" --notes "Auto-built from commit ${{ github.sha }}" --prerelease
